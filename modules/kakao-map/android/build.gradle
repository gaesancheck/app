plugins {
    id 'com.android.library'
    id 'expo-module-gradle-plugin'
}

group = 'expo.modules.kakaomap'
version = '1.0.0'

android {
    namespace 'expo.modules.kakaomap'
    defaultConfig {
        consumerProguardFiles 'consumer-rules.pro'
    }
}

dependencies {
    implementation 'com.kakao.maps.open:android:2.15.2'
}
